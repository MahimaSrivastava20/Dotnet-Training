<div class="bg-surface font-body-md text-body-md text-on-surface antialiased min-h-screen flex">
<div class="hidden lg:flex w-1/2 bg-surface-container relative items-center justify-center overflow-hidden">
<div class="absolute inset-0 bg-primary/10 z-10"></div>
<img alt="SafeHaven Corporate Background" class="absolute inset-0 w-full h-full object-cover z-0" data-alt="Modern corporate glass building reflecting a clear blue sky, conveying stability, institutional trust, and structural security in soft natural lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCWro-hNjRg1Eg5Lv1r6j7Cw2qnZWuN-YWrvrr5ecndL312LIvceyZGIg1WN8tGCX2wqIljSiJ3yD_StvQ2NLwcGEUtw5_g5ydSoYdcLn_WXVribF-aXTrT8fEZKefCuuZZRX9JxMRwCj-7LxVZw3rVpK0G7b51AGwHBJbL89hqO0YbhQA2CEVjVIq3GXy6mfSfIIqHDnJu5d4bM70OwQ0py370KB_oRWYbLI-TcNKbM3uTPPN5FgvqtLNcep6q9gaC-gzm-HS7HzM"/>
<div class="relative z-20 max-w-lg p-xl text-center bg-surface-container-lowest/90 backdrop-blur-sm rounded-xl shadow-sm border border-outline-variant/50">
<h1 class="font-display text-display text-primary mb-md">SafeHaven</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Streamlined insurance management. Confidence in every claim, security in every policy.</p>
</div>
</div>
<div class="w-full lg:w-1/2 flex items-center justify-center p-gutter bg-surface-container-lowest">
<div class="w-full max-w-md">
<div class="lg:hidden mb-xl text-center">
<h1 class="font-h2 text-h2 text-primary tracking-tight">SafeHaven</h1>
</div>
<div class="mb-xl">
<h2 class="font-h1 text-h1 text-on-surface mb-xs">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your details to sign in to your account.</p>
</div>

<!-- Error Message -->
@if (error()) {
<div class="mb-lg p-md bg-error/10 border border-error rounded-lg">
<p class="text-error font-body-sm text-body-sm">{{ error() }}</p>
</div>
}

<form (ngSubmit)="onSubmit()" class="flex flex-col gap-lg">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">mail</span>
</div>
<input [(ngModel)]="email" name="email" class="w-full pl-[36px] pr-sm py-sm rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder:text-outline" id="email" placeholder="Enter your email" type="email" required/>
</div>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-on-primary-fixed-variant" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">lock</span>
</div>
<input [(ngModel)]="password" name="password" class="w-full pl-[36px] pr-sm py-sm rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder:text-outline" id="password" placeholder="••••••••" type="password" required/>
</div>
</div>
<button [disabled]="loading()" class="w-full bg-primary text-on-primary font-label-md text-label-md py-md rounded-lg hover:bg-on-primary-fixed-variant flex justify-center items-center gap-xs shadow-sm mt-sm disabled:opacity-50" type="submit">
                    @if (loading()) {
                        <span>Loading...</span>
                    } @else {
                        <span>Login</span>
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                    }
</button>
</form>
<div class="mt-xl relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-sm bg-surface-container-lowest font-body-sm text-body-sm text-on-surface-variant">Or continue with</span>
</div>
</div>
<div class="mt-xl">
<button class="w-full border border-outline-variant bg-surface-container-lowest text-on-surface font-label-md text-label-md py-md rounded-lg hover:bg-surface-container-low flex justify-center items-center gap-sm shadow-sm" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Sign in with Google
                </button>
</div>
<p class="mt-margin text-center font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account? <a routerLink="/register" class="text-primary font-label-md text-label-md hover:text-on-primary-fixed-variant">Sign up</a>
</p>
</div>
</div>
</div>
